name: KokoroVoice
options:
  bundleIdPrefix: com.conner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # FluidAudio at a pinned commit with our compact-lexicon patch applied by
  # scripts/vendor_fluidaudio.py (run it before xcodegen).
  FluidAudio:
    path: Vendor/FluidAudio
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  # Engine, SSML, DSP and the audio unit class; shared by the app, the
  # extension and the tests. Embedded once in the app's Frameworks folder.
  KokoroKit:
    type: framework
    platform: iOS
    sources:
      - path: Shared
    dependencies:
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conner.kokorovoice.kit
        PRODUCT_NAME: KokoroKit
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  KokoroVoice:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: KokoroKit
      - target: KokoroSynth
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kokoro Voice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conner.kokorovoice
        PRODUCT_NAME: KokoroVoice
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  # The speech synthesis provider (an Audio Unit extension of type 'ausp').
  KokoroSynth:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension/Sources
      - path: Extension/Models
        type: folder
        buildPhase: resources
    dependencies:
      - target: KokoroKit
        embed: false
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Kokoro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AudioUnitFactory
          NSExtensionAttributes:
            AudioComponents:
              - name: "Conner: Kokoro"
                description: Kokoro neural voices
                manufacturer: Cnnr
                subtype: koko
                type: ausp
                version: 1
                sandboxSafe: true
                tags:
                  - Speech Synthesizer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conner.kokorovoice.synth
        PRODUCT_NAME: KokoroSynth
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  KokoroVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: KokoroVoice
      - target: KokoroKit
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.conner.kokorovoice.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/KokoroVoice.app/KokoroVoice
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  KokoroVoice:
    build:
      targets:
        KokoroVoice: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - KokoroVoiceTests
